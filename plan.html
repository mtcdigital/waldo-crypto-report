function deriveKey(pw){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.rounds,hash:'SHA-256'},k,256)})}
function open(rawKey){return crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},k,b64(P.ct))}).then(function(pt){var html=dec.decode(pt);document.open();document.write(html);document.close()})}
function tryStored(){try{var s=localStorage.getItem(KEYSTORE);if(!s)return;open(b64(s)).catch(function(){try{localStorage.removeItem(KEYSTORE)}catch(e){}})}catch(e){}}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var pw=document.getElementById('pw').value;document.getElementById('err').textContent='';
  deriveKey(pw).then(function(raw){var rawU8=new Uint8Array(raw);return open(rawU8).then(function(){if(document.getElementById('rem')&&document.getElementById('rem').checked){try{var s='';for(var i=0;i<rawU8.length;i++)s+=String.fromCharCode(rawU8[i]);localStorage.setItem(KEYSTORE,btoa(s))}catch(e){}}})}).catch(function(){document.getElementById('err').textContent='That is not it. Try again.'})});
tryStored();
})();
</script></body></html>
